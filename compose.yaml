services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kubero_wrapper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - atlas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kubero_wrapper"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/kubero_wrapper
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      JWT_EXPIRY_HOURS: 24
      ATLAS_CI_ENABLED: ${ATLAS_CI_ENABLED:-false}
      ATLAS_CI_CENTRAL_READY: ${ATLAS_CI_CENTRAL_READY:-false}
      ATLAS_CI_MODE: ${ATLAS_CI_MODE:-central}
      WOODPECKER_URL: ${WOODPECKER_URL:-https://wood.atlasfy.site}
      WOODPECKER_TOKEN: ${WOODPECKER_TOKEN:-}
      WOODPECKER_TOKEN_FILE: ${WOODPECKER_TOKEN_FILE:-}
      WOODPECKER_EXPECTED_AUTHOR: ${WOODPECKER_EXPECTED_AUTHOR:-}
      ATLAS_CI_AUTHORIZATION_TOKEN: ${ATLAS_CI_AUTHORIZATION_TOKEN:-}
      ATLAS_CI_PUBLICATION_TOKEN: ${ATLAS_CI_PUBLICATION_TOKEN:-}
      ATLAS_CI_PUBLICATION_TOKEN_FILE: ${ATLAS_CI_PUBLICATION_TOKEN_FILE:-}
      ATLAS_CI_AUTHORIZATION_TOKEN_FILE: ${ATLAS_CI_AUTHORIZATION_TOKEN_FILE:-}
      ATLAS_REGISTRY_URL: ${ATLAS_REGISTRY_URL:-https://10.10.10.10:5000}
      ATLAS_REGISTRY_NAMESPACE: ${ATLAS_REGISTRY_NAMESPACE:-atlas}
      ATLAS_REGISTRY_USERNAME: ${ATLAS_REGISTRY_USERNAME:-}
      ATLAS_REGISTRY_PASSWORD: ${ATLAS_REGISTRY_PASSWORD:-}
      ATLAS_REGISTRY_PASSWORD_FILE: ${ATLAS_REGISTRY_PASSWORD_FILE:-}
      ATLAS_REGISTRY_TOKEN: ${ATLAS_REGISTRY_TOKEN:-}
      ATLAS_REGISTRY_TOKEN_FILE: ${ATLAS_REGISTRY_TOKEN_FILE:-}
      ATLAS_REGISTRY_CA_FILE: ${ATLAS_REGISTRY_CA_FILE:-}
      ATLAS_CI_TEST_REPOSITORY: ${ATLAS_CI_TEST_REPOSITORY:-}
      ATLAS_CI_HTTP_TIMEOUT_SECONDS: ${ATLAS_CI_HTTP_TIMEOUT_SECONDS:-15}
      ATLAS_CI_POLL_SECONDS: ${ATLAS_CI_POLL_SECONDS:-5}
      ATLAS_CI_RUN_TIMEOUT_SECONDS: ${ATLAS_CI_RUN_TIMEOUT_SECONDS:-3600}
      FRONTEND_URL: http://localhost:5173
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3000/api/github/callback}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  atlas-postgres:
