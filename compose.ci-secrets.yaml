# Wrapper-only overlay. Files are supplied by the external secret manager.
# No infrastructure services, credentials, or CI activation are defined here.
services:
  backend:
    environment:
      WOODPECKER_TOKEN: ""
      WOODPECKER_TOKEN_FILE: /run/secrets/woodpecker-token
      ATLAS_CI_AUTHORIZATION_TOKEN: ""
      ATLAS_CI_AUTHORIZATION_TOKEN_FILE: /run/secrets/ci-configuration-token
      ATLAS_CI_PUBLICATION_TOKEN: ""
      ATLAS_CI_PUBLICATION_TOKEN_FILE: /run/secrets/ci-publication-token
      ATLAS_REGISTRY_USERNAME: ""
      ATLAS_REGISTRY_PASSWORD: ""
      ATLAS_REGISTRY_PASSWORD_FILE: ""
      ATLAS_REGISTRY_TOKEN: ""
      ATLAS_REGISTRY_TOKEN_FILE: /run/secrets/registry-read-token
      ATLAS_REGISTRY_CA_FILE: /run/secrets/registry-ca
    secrets:
      - woodpecker-token
      - ci-configuration-token
      - ci-publication-token
      - registry-read-token
      - registry-ca

secrets:
  woodpecker-token:
    file: ${ATLAS_WOODPECKER_TOKEN_PATH:?External secret file required}
  ci-configuration-token:
    file: ${ATLAS_CI_CONFIGURATION_TOKEN_PATH:?External secret file required}
  ci-publication-token:
    file: ${ATLAS_CI_PUBLICATION_TOKEN_PATH:?External secret file required}
  registry-read-token:
    file: ${ATLAS_REGISTRY_READ_TOKEN_PATH:?External read-only secret file required}
  registry-ca:
    file: ${ATLAS_REGISTRY_CA_PATH:?External public PEM bundle required}
